# ─────────────────────────────────────────────────────────────────────────────
# settings.example.yaml — Safe template. Copy to settings.yaml and adjust.
# settings.yaml is git-ignored and should NEVER be committed.
# ─────────────────────────────────────────────────────────────────────────────

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  default_source: polygon          # polygon | yfinance
  timeframe: "1Day"                # Polygon timeframe string
  cache_dir: data/raw              # Local cache directory (git-ignored)
  cache_format: csv                # csv | parquet

# ── Indicators ────────────────────────────────────────────────────────────────
indicators:
  rsi:
    period: 14
  ema:
    fast: 9
    slow: 21
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    period: 20
    std_dev: 2.0
  atr:
    period: 14

# ── Signals / Strategy ────────────────────────────────────────────────────────
signals:
  default_strategy: ema_cross      # Strategy key used by signal generator
  rsi_overbought: 70
  rsi_oversold: 30

# ── Backtesting ───────────────────────────────────────────────────────────────
backtest:
  engine: backtesting              # backtesting | vectorbt
  initial_cash: 10000
  commission: 0.001                # 0.1% per trade
  results_dir: results             # git-ignored output folder

# ── Execution ─────────────────────────────────────────────────────────────────
execution:
  mode: paper                      # paper | live  — DO NOT change to live without extensive testing
  max_position_pct: 0.10           # Max 10% of portfolio per position
  stop_loss_pct: 0.02              # 2% stop loss
  log_dir: logs                    # git-ignored log folder

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO                      # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
